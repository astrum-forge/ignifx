<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>ignifx — first person</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8ecf4;
        --panel: #141a26;
        --accent: #4ad2f0;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1017;
        color: var(--ink);
        font:
          14px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        /* A game canvas owns every gesture on it: without this a swipe scrolls the page and a
           double tap zooms it, and neither reaches the on-screen sticks. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #unsupported {
        display: none;
        position: absolute;
        inset: 0;
        place-content: center;
        padding: 2rem;
        text-align: center;
      }

      #unsupported h1 {
        font-size: 1.25rem;
        font-weight: 600;
      }

      body[data-webgpu="unavailable"] #game,
      body[data-webgpu="unavailable"] .ignifx-ui-root {
        display: none;
      }

      body[data-webgpu="unavailable"] #unsupported {
        display: grid;
      }

      /* ---------------------------------------------------------------------------------------
         `@ignifx/ui` injects one small stylesheet of single-class rules with no `!important`, so
         a template's own CSS wins on order. Everything below restyles its helper widgets; none of
         it changes what they do. The class names are `UI_CLASS_NAMES`.
         --------------------------------------------------------------------------------------- */

      .ignifx-ui-loading {
        background: #0d1017;
        gap: 1rem;
      }

      .ignifx-ui-loading-label {
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.8rem;
        opacity: 0.75;
      }

      .ignifx-ui-loading-track {
        height: 4px;
        background: #232b3a;
      }

      .ignifx-ui-loading-bar,
      .ignifx-ui-dialog-button {
        background: var(--accent);
      }

      .ignifx-ui-dialog-button {
        color: #171104;
        font-weight: 600;
      }

      .ignifx-ui-dialog-panel {
        min-width: 16rem;
        background: var(--panel);
        border: 1px solid rgb(232 236 244 / 12%);
        box-shadow: 0 1.5rem 3rem rgb(0 0 0 / 45%);
      }

      .ignifx-ui-joystick,
      .ignifx-ui-button {
        border: 2px solid rgb(232 236 244 / 30%);
        background: rgb(12 18 30 / 45%);
        backdrop-filter: blur(2px);
      }

      .ignifx-ui-joystick-knob {
        background: rgb(232 236 244 / 55%);
      }

      .ignifx-ui-button {
        color: var(--ink);
        font-weight: 600;
      }

      /* The crosshair, at the exact centre of the overlay — which is the exact centre of the
         canvas, which is where `src/scripts/interactor.ts` casts its ray from. */
      .crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        border: 2px solid rgb(232 236 244 / 70%);
        border-radius: 50%;
        transition: border-color 120ms linear;
      }

      .crosshair[data-target="hit"] {
        border-color: var(--accent);
      }

      /* The HUD line `src/game-ui.ts` appends to the `hud` layer. Plain DOM: real text, real
         fonts, and no `FontAsset` — see the note in that file about why this is not `HudText`. */
      .hud {
        position: absolute;
        top: calc(1rem + var(--ignifx-safe-top, 0px));
        left: calc(1rem + var(--ignifx-safe-left, 0px));
        padding: 0.35rem 0.7rem;
        border-radius: 0.35rem;
        background: rgb(12 18 30 / 55%);
        font-variant-numeric: tabular-nums;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="unsupported" role="alert">
      <h1>This browser cannot run ignifx</h1>
      <p>
        ignifx renders through WebGPU only. Use Chrome or Edge 113+, Safari 26+, or Firefox 141+ on Windows / 145+ on
        Apple Silicon.
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
