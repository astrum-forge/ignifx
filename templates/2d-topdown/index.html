<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>ignifx — top-down</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8ecf4;
        --panel: #121826;
        --accent: #7fd4a0;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0f18;
        color: #e8ecf4;
        font:
          14px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        /* A game canvas owns every gesture on it: without this a swipe scrolls the page and a
           double tap zooms it, and neither reaches the on-screen stick. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #unsupported {
        display: none;
        position: absolute;
        inset: 0;
        place-content: center;
        padding: 2rem;
        text-align: center;
      }

      #unsupported h1 {
        font-size: 1.25rem;
        font-weight: 600;
      }

      body[data-webgpu="unavailable"] #game,
      body[data-webgpu="unavailable"] .ignifx-ui-root {
        display: none;
      }

      body[data-webgpu="unavailable"] #unsupported {
        display: grid;
      }

      /* ---------------------------------------------------------------------------------------
         `@ignifx/ui` injects one small stylesheet of single-class rules with no `!important`, so
         a template's own CSS wins on order. Everything below restyles its helper widgets; none of
         it changes what they do. The class names are `UI_CLASS_NAMES`.
         --------------------------------------------------------------------------------------- */

      .ignifx-ui-loading {
        background: #0b0f18;
        gap: 1rem;
      }

      .ignifx-ui-loading-label {
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.8rem;
        opacity: 0.75;
      }

      .ignifx-ui-loading-track {
        height: 4px;
        background: #1e2636;
      }

      .ignifx-ui-loading-bar,
      .ignifx-ui-dialog-button {
        background: #7fd4a0;
      }

      .ignifx-ui-dialog-button {
        color: #131007;
        font-weight: 600;
      }

      .ignifx-ui-dialog-panel {
        min-width: 16rem;
        background: #121826;
        border: 1px solid rgb(232 236 244 / 12%);
        box-shadow: 0 1.5rem 3rem rgb(0 0 0 / 45%);
      }

      /* The on-screen controls, now `@ignifx/ui`'s `VirtualJoystick` and `VirtualButton` rather
         than the thumbstick this template used to hand-roll in `src/touch-controls.ts`. They are
         built only on a device that reports touch points, so a desktop page never has them. */
      .ignifx-ui-joystick,
      .ignifx-ui-button {
        border: 2px solid rgb(232 236 244 / 35%);
        background: rgb(12 18 30 / 45%);
        backdrop-filter: blur(2px);
      }

      .ignifx-ui-joystick-knob {
        background: rgb(232 236 244 / 55%);
      }

      .ignifx-ui-button {
        color: #e8ecf4;
        font-weight: 600;
      }

      /* The HUD line `src/game-ui.ts` appends to the `hud` layer. Plain DOM: real text, real
         fonts, and no `FontAsset` — see the note in that file about why this is not `HudText`. */
      .hud {
        position: absolute;
        top: calc(1rem + var(--ignifx-safe-top, 0px));
        left: calc(1rem + var(--ignifx-safe-left, 0px));
        padding: 0.35rem 0.7rem;
        border-radius: 0.35rem;
        background: rgb(12 18 30 / 55%);
        font-variant-numeric: tabular-nums;
        white-space: pre;
      }

      /* ---------------------------------------------------------------------------------------
         The screens — title, pause, settings, rebinding and credits — are `@ignifx/ui`'s `Menu`
         widget, mounted in `app.ui.layer("menu")` by `src/menus/game-menus.ts`. The package ships a
         handful of shape-only defaults under the same class names; everything below is this
         template's skin over them, and it wins because the package injects its stylesheet at the
         *top* of `<head>`, ahead of this one.
         --------------------------------------------------------------------------------------- */

      .ignifx-ui-menu {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: stretch;
        gap: 0.35rem;
        padding: 2rem 1rem;
        overflow: auto;
        pointer-events: auto;
        background: rgb(6 9 16 / 84%);
        backdrop-filter: blur(3px);
      }

      /* `@ignifx/ui` already carries `.ignifx-ui-menu[hidden] { display: none }`, which outranks the
         single-class rule above; nothing here needs to repeat it. */

      .ignifx-ui-menu-separator {
        margin: 0.6rem 0.75rem;
        border-top: 1px solid rgb(232 236 244 / 15%);
      }

      .ignifx-ui-menu-title {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .ignifx-ui-menu-subtitle {
        margin: 0 0 0.75rem;
        max-width: 24rem;
        opacity: 0.65;
      }

      .ignifx-ui-menu-rows {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        min-width: min(24rem, 100%);
      }

      .ignifx-ui-menu-heading {
        margin-top: 0.85rem;
        padding: 0 0.75rem;
        font-size: 0.7rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        opacity: 0.5;
      }

      .ignifx-ui-menu-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 0.75rem;
        padding: 0.45rem 0.75rem;
        border: 1px solid transparent;
        border-radius: 0.3rem;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .ignifx-ui-menu-row[data-focused] {
        border-color: var(--accent);
        background: rgb(255 255 255 / 8%);
      }

      .ignifx-ui-menu-row[data-disabled] {
        opacity: 0.35;
        cursor: default;
      }

      .ignifx-ui-menu-row-value {
        opacity: 0.8;
        font-variant-numeric: tabular-nums;
      }

      .ignifx-ui-menu-row-slider {
        width: 8rem;
        accent-color: var(--accent);
      }

      .ignifx-ui-menu-row[data-kind="binding"] .ignifx-ui-menu-row-value {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85em;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="unsupported" role="alert">
      <h1>This browser cannot run ignifx</h1>
      <p>
        ignifx renders through WebGPU only. Use Chrome or Edge 113+, Safari 26+, or Firefox 141+ on Windows / 145+ on
        Apple Silicon.
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
