<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>ignifx — top-down</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0f18;
        color: #e8ecf4;
        font:
          14px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        /* A game canvas owns every gesture on it: without this a swipe scrolls the page and a
           double tap zooms it, and neither reaches the on-screen stick. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #unsupported {
        display: none;
        position: absolute;
        inset: 0;
        place-content: center;
        padding: 2rem;
        text-align: center;
      }

      #unsupported h1 {
        font-size: 1.25rem;
        font-weight: 600;
      }

      body[data-webgpu="unavailable"] #game {
        display: none;
      }

      body[data-webgpu="unavailable"] #unsupported {
        display: grid;
      }

      body[data-webgpu="unavailable"] .touch-controls {
        display: none;
      }

      /* The on-screen controls `src/touch-controls.ts` builds. They are created only on a device
         that reports touch points, so a desktop page never has them in the tree at all. */
      .touch-controls {
        position: absolute;
        inset: auto 0 0 0;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 1.5rem calc(1.5rem + env(safe-area-inset-right)) calc(1.5rem + env(safe-area-inset-bottom))
          calc(1.5rem + env(safe-area-inset-left));
        pointer-events: none;
      }

      .touch-stick,
      .touch-button {
        pointer-events: auto;
        border-radius: 50%;
        border: 2px solid rgb(232 236 244 / 35%);
        background: rgb(12 18 30 / 45%);
        backdrop-filter: blur(2px);
      }

      .touch-stick {
        position: relative;
        width: 8rem;
        height: 8rem;
        display: grid;
        place-items: center;
      }

      .touch-knob {
        width: 3.25rem;
        height: 3.25rem;
        border-radius: 50%;
        background: rgb(232 236 244 / 55%);
        will-change: transform;
      }

      .touch-buttons {
        display: flex;
        gap: 1rem;
      }

      .touch-button {
        width: 4.5rem;
        height: 4.5rem;
        color: inherit;
        font: inherit;
        font-size: 1.1rem;
        font-weight: 600;
      }

      .touch-button:active {
        background: rgb(232 236 244 / 30%);
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="unsupported" role="alert">
      <h1>This browser cannot run ignifx</h1>
      <p>
        ignifx renders through WebGPU only. Use Chrome or Edge 113+, Safari 26+, or Firefox 141+ on Windows / 145+ on
        Apple Silicon.
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
