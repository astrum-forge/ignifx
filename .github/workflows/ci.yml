# The gate every pull request has to clear (coding standards §12). A red job's name says which
# rule broke; `static` and `typecheck` hold more than one check, and their step names say which.
#
# Jobs run in parallel. Each one restores Turborepo's cache from earlier runs
# (.github/actions/setup), so a build only redoes what the commit changed. Jobs that only read
# `packages/*/dist` run `pnpm build:packages`; `build` builds everything.
#
# There are no visual-golden or frame-budget jobs and nothing runs on a schedule (owner decision,
# 2026-10-03): `pnpm test:visual` and `pnpm test:frame-budget` are run locally, and only when a change
# needs them (coding standards §10, §12). `pnpm check` runs the same checks locally, in parallel, in about 20 s.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Required checks have to report in the merge queue too, and merge_group is a separate event
  # from pull_request — without this the queue would wait forever on checks that never run.
  merge_group:
  # Run the gate by hand on a branch.
  workflow_dispatch:

# One run per ref. github.head_ref is only set for pull_request, hence the fallback; for
# merge_group, github.ref is unique per merge group, so queued runs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # What the pull request touched, for the jobs that only matter to some changes. Every other
  # event runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${BASE}" HEAD)"
          # The desktop packaging depends on the Electron package, the template it packages, the
          # scaffolder that writes desktop variants, the lockfile and this workflow.
          if printf '%s\n' "${changed}" | grep -qE '^(packages/(electron|cli)/|templates/3d-third-person/|tests/visual/playwright\.desktop|tests/visual/tests/desktop|pnpm-lock\.yaml|\.github/)'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  # The checks that need an install but no build.
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - name: format
        run: pnpm format:check
      # CONSTITUTION.md §11.2: every third-party production dependency is recorded in
      # THIRD_PARTY_NOTICES.md. The generator reads the installed tree, so a dependency added
      # without regenerating the file is a red build rather than a discovery at release time.
      # `pnpm audit` is deliberately NOT here: an advisory-database outage, or an advisory with no
      # fix yet, would turn every unrelated pull request red. It is run and recorded by hand in
      # docs/security/electron-review-2026-09.md.
      - name: licenses
        run: |
          pnpm licenses:check
          pnpm licenses:notices
          git diff --exit-code -- THIRD_PARTY_NOTICES.md
      # dependency-cruiser: no cycles, and the layering of docs/architecture/00-overview.md §2.1
      # (standards §12 step 6).
      - name: deps
        run: pnpm deps
      # CONSTITUTION.md §4.2 / standards §15: no migration documents are written before 1.0.
      # docs/migrations/README.md is the placeholder that explains why the directory is empty.
      - name: migrations-guard
        run: |
          set -euo pipefail
          if [ ! -d docs/migrations ]; then
            echo "docs/migrations/ does not exist — nothing to guard"
            exit 0
          fi
          version="$(node -p "require('./packages/core/package.json').version")"
          case "${version}" in
            0.*) ;;
            *) echo "version ${version} is 1.0 or later — migration documents are now required (§4.4)."; exit 0 ;;
          esac
          stray="$(find docs/migrations -type f ! -name 'README.md' -print)"
          if [ -n "${stray}" ]; then
            echo "::error title=CONSTITUTION.md §4.2::No migration documents are written before 1.0."
            echo "${stray}"
            exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # ESLint's content-keyed cache: only files that changed since the restored run are linted
      # again (~27 s cold, ~2 s warm). The config, the plugin and the lockfile are in the key, so a
      # rule change starts from nothing.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ hashFiles('eslint.config.ts', 'pnpm-lock.yaml', 'tools/eslint-plugin-ignifx/src/**') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('eslint.config.ts', 'pnpm-lock.yaml', 'tools/eslint-plugin-ignifx/src/**') }}-
      # Workspace packages resolve through their `exports` to `dist/`, so anything that types or
      # imports `@ignifx/*` needs the built output first; a missing dist surfaces as thousands of
      # `error`-typed lint findings or TS2307.
      - run: pnpm build:packages
      # oxlint --type-aware (errors only), then ESLint for the rules Oxlint lacks (standards §6).
      - run: pnpm lint

  # Types and the API reports: both are the TypeScript view of the packages.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:packages
      - name: typecheck
        run: pnpm typecheck
      # API Extractor fails on any drift from the committed api/*.api.md (CONSTITUTION.md §4.5).
      - name: api-report
        run: pnpm api-report

  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:packages
      # The `node` and `node-isolated` projects on Lite's null engine, with the coverage floors of
      # CONSTITUTION.md §6.2 enforced as thresholds in vitest.config.ts.
      - run: pnpm test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          # `warn`, not `error`: when the suite fails there may be no lcov file, and a second red
          # step would only hide the real failure.
          if-no-files-found: warn
          retention-days: 14

  # CONSTITUTION.md §6.4: budgets are tests. The `perf` Vitest project — bundle-size ceilings,
  # retained heap, and the timing assertions — on a runner of its own, because a timing assertion
  # beside the unit suite measured the unit suite (devtools-closed and spike-s6-1 went red that way).
  perf:
    name: perf
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:packages
      - run: pnpm test:perf

  test-browser:
    name: test-browser (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two runners, because the suite is bound by Chromium's one GPU process: SwiftShader renders
    # every page's frames there, so more pages in one browser do not go faster (2, 4 and 7 workers
    # all measured 89–109 s locally, 2026-10-02), while a second browser on a second machine halves
    # the work. This job is the longest on a pull request.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: "true"

      # The Chromium build is the variable that decides whether WebGPU works on a GPU-less runner,
      # so it is printed before the suite runs rather than guessed at afterwards.
      - name: Report the Chromium build under test
        run: |
          CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          echo "Playwright Chromium: ${CHROMIUM}"
          "${CHROMIUM}" --version || echo "could not query the Chromium build directly"

      # Chromium flags live in vitest.config.ts and switch on the platform (ADR-0009, "WebGPU flags
      # on Linux (2026-09-06)"). This job is the plan's Phase 0 exit criterion ("browser test job
      # proves WebGPU is available in CI"), so it must not be continue-on-error: if it goes red, the
      # flags are wrong and the fix belongs in vitest.config.ts, not in a suppression here.
      - run: pnpm build:packages
      - run: pnpm test:browser --shard=${{ matrix.shard }}/2

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      # publint + @arethetypeswrong/cli on the packed tarball (standards §12 step 4).
      - run: pnpm pack-check

  desktop-build:
    # Phase 9's packaging gate: the desktop variant of a template has to build, and then package,
    # on every platform ignifx claims. It is a matrix because `electron-builder` cannot
    # cross-compile most targets — a macOS app needs macOS, and a Windows installer needs Windows —
    # so "it builds" is only a claim about the runner it ran on.
    #
    # On a pull request it runs only when the change can affect packaging (`changes` above); macOS
    # and Windows minutes bill at 10× and 2× the Linux rate.
    #
    # `--dir` on purpose: it produces an unpacked, runnable application without invoking any
    # platform installer tooling or any signing identity, which is what makes this job green on a
    # bare runner. Real installers (`--mac`, `--win`, `--linux`) and signing are a release concern,
    # documented after 1.0 (docs/adr/0018-electron-tooling.md).
    #
    # The Electron suite runs on macOS only, and that is a stated gap rather than an oversight: it
    # is the one platform where this has been verified end to end (ADR-0018, S9.1).
    name: desktop-build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing should not hide what the other two did.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The template and the `@ignifx/*` packages it bundles — `electron-vite` will not build a
      # renderer whose workspace dependencies have no `dist/`. Not the whole workspace: nothing here
      # needs it.
      - run: pnpm exec turbo run build --filter=ignifx-template-3d-third-person...

      - name: Build the desktop bundles
        run: pnpm --filter ignifx-template-3d-third-person run build:desktop

      - name: Package an unpacked, unsigned app
        run: pnpm --filter ignifx-template-3d-third-person run dist:desktop
        env:
          # Nothing is signed here, and electron-builder should not go looking for a certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Report what was packaged
        shell: bash
        run: |
          echo "release/ contents:"
          ls -la templates/3d-third-person/release/ || true
          du -sh templates/3d-third-person/release/* 2>/dev/null || true

      # Verified on macOS arm64 only (ADR-0018). Windows is configuration; Linux builds here but
      # its WebGPU path is unverified, so neither runs the suite.
      - name: Run the Electron suite
        if: runner.os == 'macOS'
        run: pnpm --filter ignifx-visual-tests run test:desktop

      - name: Upload the failing runs
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-traces-${{ matrix.os }}
          path: |
            tests/visual/test-results/**
            tests/visual/playwright-report/**
          if-no-files-found: warn
          retention-days: 14

  docs-harness:
    name: docs-harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `fetch-depth: 0`, not the default 1: on a pull request this job runs `api-report-gate` and
      # `freshness`, which diff against the base commit, and a shallow checkout does not contain it
      # (both reported "could not diff against <sha>" on 2026-09-07).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm build:packages
      # CONSTITUTION.md §5.2/§5.5: examples compile and run, and the skill matches the current API.
      # `regeneration-diff` runs every generator (docs:api, docs:schemas, docs:recipes)
      # and fails on any difference from the committed output (standards §15). On a pull request
      # the harness also runs its two diff-based gates against the base commit; the
      # `docs-not-needed` label waives the skill-change half of the API-report gate
      # (16-docs-harness-and-skill.md §4), with the justification in the PR body.
      - run: pnpm docs:harness ${{ github.event_name == 'pull_request' && format('--base {0}', github.event.pull_request.base.sha) || '' }} ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'docs-not-needed') && '--allow-docs-not-needed' || '' }}
      # The harness compares the tree before and after it regenerates; this catches the other half
      # — a generated file that is out of date in the commit itself.
      - name: Fail on generated-docs drift
        run: |
          git diff --exit-code -- \
            skills/ignifx/references/api \
            skills/ignifx/references/formats \
            skills/ignifx/references/recipes \
            'packages/*/api'
