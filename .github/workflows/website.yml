# Checks for website/ (the ignifx.com public site). This workflow does NOT deploy.
#
# Hosting is Cloudflare Pages, connected directly to this repository (ADR-0019, owner requirement
# 2026-09-06): Cloudflare runs `pnpm install` and then the build command on every push to `main` and
# serves `website/dist`. Since ADR-0020 that command is `pnpm turbo run build
# --filter=@ignifx/website...` — the site runs the engine's examples, so the workspace packages must
# be built first, and the `...` suffix is what orders that. This workflow runs the same command, so a
# pull request fails here rather than on a Pages preview.
#
# The `paths` filter is wide for the same reason: an engine change, an example, a template or a
# visual-suite change can now break the site.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "packages/**"
      - "examples/**"
      - "templates/**"
      - "tests/visual/**"
      - "skills/**"
      - "packages/*/skills/**"
      - "scripts/docs-llms.ts"
      - "scripts/lib/llms-index.ts"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "packages/**"
      - "examples/**"
      - "templates/**"
      - "tests/visual/**"
      - "skills/**"
      - "packages/*/skills/**"
      - "scripts/docs-llms.ts"
      - "scripts/lib/llms-index.ts"
      - ".github/workflows/website.yml"
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  website:
    name: build and check
    runs-on: ubuntu-latest
    # The build now compiles thirteen packages, every example and the templates before it renders a
    # page; 15 minutes was sized for a site that imported nothing.
    timeout-minutes: 30
    env:
      # The desktop templates declare `electron` as an allowed build script; the site never runs it,
      # and downloading the binary would add ~100 MB to every job. Cloudflare needs the same variable
      # (see website/README.md, Hosting).
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # `website/public/llms.txt` is generated from skills/ and packages/*/skills/. A skill page that
      # has been added, renamed or re-summarised without regenerating it would give the site a stale
      # index — and since ADR-0020 a stale entry is a dead link to a file that no longer exists — so a
      # diff fails here rather than shipping.
      - name: llms.txt is current
        run: |
          pnpm docs:llms
          git diff --exit-code website/public/llms.txt

      - run: pnpm --filter @ignifx/website typecheck

      # The same command Cloudflare Pages runs.
      - run: pnpm turbo run build --filter=@ignifx/website...

      # Asserts the built output: every route, a run page per catalogue slug, every llms.txt URL
      # resolves to a repository file, every internal link resolves, no off-origin subresource, one
      # inline script (the JSON-LD block) and nothing else, page weight, contrast, the three header
      # blocks and the redirect table.
      - run: pnpm --filter @ignifx/website test

      - name: Upload the built site for review
        uses: actions/upload-artifact@v7
        with:
          name: website-dist
          path: website/dist
          retention-days: 7
