# Checks for website/ (the ignifx.com public site). This workflow does NOT deploy.
#
# Hosting is Cloudflare Pages, connected directly to this repository (ADR-0019, owner requirement
# 2026-09-06): Cloudflare runs `pnpm install` and then `pnpm --filter @ignifx/website build` on every
# push to `main` and serves `website/dist`. The GitHub Pages job that Phase 0 used as a placeholder
# is gone; nothing here writes to any environment. The `website/dist` artifact below exists so a
# reviewer can download the built site from a pull request.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "skills/**"
      - "packages/*/skills/**"
      - "scripts/docs-llms.ts"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "skills/**"
      - "packages/*/skills/**"
      - "scripts/docs-llms.ts"
      - ".github/workflows/website.yml"
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  website:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The desktop templates declare `electron` as an allowed build script; the site never runs it,
      # and downloading the binary would add ~100 MB to every job. Cloudflare needs the same variable
      # (see website/README.md, Hosting).
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # `website/public/llms.txt` is generated from skills/ and packages/*/skills/. A skill page that
      # has been added, renamed or re-summarised without regenerating it would give the site a stale
      # index, so a diff fails here rather than shipping.
      - name: llms.txt is current
        run: |
          pnpm docs:llms
          git diff --exit-code website/public/llms.txt

      - run: pnpm --filter @ignifx/website typecheck

      - run: pnpm --filter @ignifx/website build

      # Asserts the built output: every llms.txt URL resolves, every internal link resolves, no
      # off-origin subresource, no inline script or style, page weight, contrast, headers.
      - run: pnpm --filter @ignifx/website test

      - name: Upload the built site for review
        uses: actions/upload-artifact@v7
        with:
          name: website-dist
          path: website/dist
          retention-days: 7
