# Changesets release pipeline (CONSTITUTION.md §7.3, standards §12).
#
# On every push to main this opens or updates the "Version Packages" pull request. When that pull
# request is merged, the same run reaches the publish step and ships every `@ignifx/*` package plus
# the `ignifx` umbrella on one fixed version line (CONSTITUTION.md §4.1).
#
# THIS PUBLISHES FOR REAL (2026-09-07). What is set up on npmjs.com:
#   1. the @ignifx scope and the `ignifx` name are claimed by the `astrumforge` account, and every
#      package holds a 0.0.0 placeholder published by hand on 2026-09-06 — so no publish here is a
#      first publish, which is the case npm Trusted Publishing cannot bootstrap on its own;
#   2. Trusted Publisher = GitHub Actions is configured per package against THIS workflow file
#      (`release.yml`); npm does not validate that configuration until publish time, which is why
#      the verify step below exists;
#   3. `pnpm release` (root package.json) is the publish script, and changesets 3.x detects pnpm and
#      shells out to `pnpm publish`, whose OIDC path takes precedence over any static token
#      (pnpm ≥ 11.0.7; the 404-on-OIDC regression of pnpm/pnpm#11513 is fixed in 11.1.3, and this
#      repository is on 11.17.0).
#
# NO PROVENANCE WHILE THE REPOSITORY IS PRIVATE. `publishConfig.provenance` is `false` in every
# package because npm cannot generate a provenance attestation from a private source repository
# (github.blog, 2023-07-25) — not even under Trusted Publishing, which otherwise generates one with
# no flag. CONSTITUTION.md §9.4 asks for provenance; making astrum-forge/ignifx public is what
# restores it, and the flip is then `"provenance": true` in the 13 manifests and nothing here.
# Recorded in docs/adr/0009-monorepo-tooling.md.
#
# A dry run is still one `workflow_dispatch` away, and `RELEASE_DRY_RUN` below turns the whole
# pipeline back into one. A dry run does everything a publish does except contact the registry.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          Publish as a dry run: build, pack and inspect the real tarballs without contacting the
          registry. It can only make the run drier — it never turns a dry run into a real publish.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # contents: write and pull-requests: write — changesets/action commits the version bump and
  # opens the Version Packages pull request.
  # id-token: write — the OIDC token npm Trusted Publishing mints. This is the credential; there is
  # no NPM_TOKEN secret in this repository and there should not be one.
  contents: write
  pull-requests: write
  id-token: write

env:
  # Flip to "true" to turn every push into a dry run again (a bad release, a registry incident).
  RELEASE_DRY_RUN: "false"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets reads the history to work out what changed since the last release.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Decide publish mode
        id: mode
        run: |
          set -euo pipefail
          if [ "${RELEASE_DRY_RUN}" = "true" ] || [ "${MANUAL_DRY_RUN}" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "Publishing as a DRY RUN — nothing will be sent to the registry."
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "Publishing for real via npm Trusted Publishing."
          fi
        env:
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}

      # Packages are built before publishing so a dry run inspects the real tarballs, and so the
      # publish never races the build.
      - run: pnpm build

      - name: Changesets version / publish
        id: changesets
        uses: changesets/action@v2
        with:
          # `pnpm version-packages`, not a bare `changeset version`: the bump has to reach two more
          # places that Changesets knows nothing about. Every skill declares the engine version it
          # documents in `metadata.ignifx-version`, and `skills/ignifx/references/formats/
          # ignifx.schemas.json` embeds it too — so a bare bump leaves the "Version Packages" branch
          # failing `docs-harness` with ten skill-lint problems and a regeneration diff, which is
          # exactly what the first version pull request did on 2026-09-07.
          version-script: pnpm version-packages
          # v2 renamed this input from `publish` (v1) to `publish-script`.
          # `--no-git-checks` is needed because the runner is on a detached checkout;
          # `--access public` matches publishConfig in each package.
          publish-script: "${{ steps.mode.outputs.dry_run == 'true' && 'pnpm -r publish --dry-run --no-git-checks --access public' || 'pnpm release' }}"
          # Tags and GitHub releases would be lies during a dry run — nothing was published.
          create-github-releases: ${{ steps.mode.outputs.dry_run != 'true' }}
          push-git-tags: ${{ steps.mode.outputs.dry_run != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A publisher's exit code is not evidence that a release arrived. `changeset publish` ships one
      # package at a time, so a failure part-way leaves half a release on the registry, and a Trusted
      # Publisher pointed at the wrong workflow file answers E404 for a scoped package — which is
      # exactly the shape `@ignifx/*` has (npm/cli#8976). This asks registry.npmjs.org for every
      # version the working tree carries, and goes red if any of them is not there.
      - name: Verify the release reached npm
        if: steps.mode.outputs.dry_run != 'true' && steps.changesets.outputs.published == 'true'
        run: pnpm release:verify

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Release"
            echo
            if [ "${DRY_RUN}" = "true" ]; then
              echo "Dry run — nothing was sent to the registry."
            elif [ "${PUBLISHED}" = "true" ]; then
              echo "Published, and verified against registry.npmjs.org:"
              echo
              echo '```json'
              echo "${PUBLISHED_PACKAGES}"
              echo '```'
            else
              echo "No publish this run. The \"Version Packages\" pull request is open or up to date;"
              echo "merging it is what releases."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          # v2 names its outputs in kebab-case: `published-packages`, not `publishedPackages`. The
          # index form is required — `outputs.published-packages` parses as a subtraction.
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs['published-packages'] }}
