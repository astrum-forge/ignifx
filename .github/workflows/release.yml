# Changesets release pipeline (CONSTITUTION.md §7.3, standards §12).
#
# On every push to main this opens or updates the "Version Packages" pull request. When that pull
# request is merged, the same run reaches the publish step.
#
# PHASE 0 SHIPS THIS AS A DRY RUN. The @ignifx npm scope is not claimed yet and npm Trusted
# Publishing is not configured (engineering plan §9.1, items 1 and 5), so the publish step runs
# `pnpm -r publish --dry-run`, which does everything a publish would do except contact the
# registry. To go live, the repository owner:
#   1. claims the @ignifx scope and the ignifx package name on npmjs.com;
#   2. configures Trusted Publisher = GitHub Actions for each package, naming this workflow file
#      (`release.yml`) exactly — npm does not validate that configuration until publish time;
#   3. adds a `release` script to the root package.json (see CONTRIBUTING.md and the pull request
#      that lands this file);
#   4. flips RELEASE_DRY_RUN below to "false".
# Provenance is automatic under Trusted Publishing; no --provenance flag is needed.
#
# Known risk to pilot before flipping the switch: npm/cli#8976 reports Trusted-Publishing OIDC
# failing with E404 for *scoped* packages published through changesets/action. @ignifx/* is exactly
# that shape, so publish one low-stakes package first and keep a token-based fallback documented.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          Publish as a dry run. Leave this on until the npm scope and Trusted Publishing are set up.
          It can only make the run drier: it never turns a dry run into a real publish.
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # contents: write and pull-requests: write — changesets/action commits the version bump and
  # opens the Version Packages pull request.
  # id-token: write — the OIDC token npm Trusted Publishing mints (unused while the dry run is on,
  # but the permission is what the live path needs).
  contents: write
  pull-requests: write
  id-token: write

env:
  # Flip to "false" once steps 1-3 in the header comment are done.
  RELEASE_DRY_RUN: "true"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets reads the history to work out what changed since the last release.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Decide publish mode
        id: mode
        run: |
          set -euo pipefail
          if [ "${RELEASE_DRY_RUN}" = "true" ] || [ "${MANUAL_DRY_RUN}" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "Publishing as a DRY RUN — nothing will be sent to the registry."
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "Publishing for real via npm Trusted Publishing."
          fi
        env:
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}

      # Packages are built before publishing so the dry run inspects the real tarballs.
      - run: pnpm build

      - name: Changesets version / publish
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          # v2 renamed this input from `publish` (v1) to `publish-script`.
          # `--no-git-checks` is needed because the runner is on a detached checkout;
          # `--access public` matches publishConfig in each package.
          publish-script: "${{ steps.mode.outputs.dry_run == 'true' && 'pnpm -r publish --dry-run --no-git-checks --access public' || 'pnpm release' }}"
          # Tags and GitHub releases would be lies during a dry run — nothing was published.
          create-github-releases: ${{ steps.mode.outputs.dry_run != 'true' }}
          push-git-tags: ${{ steps.mode.outputs.dry_run != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
